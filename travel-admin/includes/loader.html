<div class="loader-overlay" id="loader" style="position:fixed;top:0;left:0;width:100%;height:100%;background:#F8FAFC;z-index:9999;display:flex;align-items:center;justify-content:center;transition: opacity 0.3s ease;">
    <div style="width: 50px; height: 50px; border: 4px solid #CBD5E1; border-top-color: #2563EB; border-radius: 50%; animation: spin 1s linear infinite;"></div>
</div>
<style>
@keyframes spin { to { transform: rotate(360deg); } }
</style>
<script>
window.addEventListener("load", () => {
    const l = document.getElementById("loader");
    if (l) {
        l.style.opacity = "0";
        setTimeout(() => l.style.display = "none", 300);
    }
});
</script>
